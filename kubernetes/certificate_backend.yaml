apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: apiwander-tls
  namespace: istio-system
spec:
  secretName: apiwander-credential
  dnsNames:
  - apiwander.needoo.in
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  duration: 2160h
  renewBefore: 720h
  isCA: false
  usages:
    - server auth