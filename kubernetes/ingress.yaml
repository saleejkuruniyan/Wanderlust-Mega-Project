apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wanderlust-ingress
  namespace: wanderlust
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    cert-manager.io/cluster-issuer: "internal-ca-issuer"
    external-dns.alpha.kubernetes.io/hostname: "wander-test.wakeb.tech"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - wander-test.wakeb.tech
      secretName: wand-tls
  rules:
    - host: wander-test.wakeb.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apiwander-ingress
  namespace: wanderlust
  annotations:
    cert-manager.io/cluster-issuer: "internal-ca-issuer"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    external-dns.alpha.kubernetes.io/hostname: "apiwander-test.wakeb.tech"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - apiwander-test.wakeb.tech
      secretName: apiwander-tls
  rules:
    - host: apiwander-test.wakeb.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
